<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="%BRAND_COLOR%" />
    <meta name="description" content="%BRAND_TAGLINE%" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/favicon.ico" sizes="32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>%BRAND_NAME%</title>
    <script>
      // El tema y la paleta del ultimo usuario de este dispositivo, antes de pintar (sin parpadeo).
      // Mismas claves que lib/themes.svelte.ts.
      (function () {
        try {
          var t = localStorage.getItem("library.theme") || "neovim";
          var d = document.documentElement;
          d.dataset.theme = t;
          d.dataset.palette = localStorage.getItem("library.palette." + t) || "";
          if (localStorage.getItem("library.reduceMotion") === "1") d.setAttribute("data-reduce-motion", "");
          var l = localStorage.getItem("library.lang");
          if (l === "en" || l === "es") d.lang = l;
        } catch (e) {}
        // Tamaño de la interfaz (mismas cuentas que lib/scale.svelte.ts): en un monitor 2K se
        // agranda todo con zoom. Los lectores (#/read, #/book) van sin zoom.
        try {
          var s = Number(localStorage.getItem("library.uiScale")) || 0;
          var w = window.innerWidth;
          var f = s ? s / 100 : matchMedia("(max-width: 759px)").matches ? 1 : w >= 2300 ? 1.33 : w >= 1800 ? 1.15 : 1;
          var z = /^#\/(read|book)\//.test(location.hash) ? 1 : f;
          if (z !== 1) document.documentElement.style.zoom = String(z);
          document.documentElement.style.setProperty("--zoom", String(z));
          document.documentElement.style.setProperty("--ui-zoom", String(f));
        } catch (e) {}
      })();
    </script>
    <style>
      /* Splash hasta que monta la app: el fondo del tema y la marca latiendo. */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--bg, #0c0c0c);
      }
      #splash img {
        width: 64px;
        height: 64px;
        animation: splash 1.4s ease-in-out infinite;
      }
      @keyframes splash {
        50% {
          transform: scale(0.92);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="splash"><img src="/icon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
