# Crate `library`: biblioteca (el server entero, `library::run`) + binario `library` (Docker).
# API HTTP (axum), SQLite (rusqlite), auth, puente a Suwayomi (GraphQL), libros subidos y la UI
# estática. Dependencias elegidas por peso: rusqlite (sin el runtime de sqlx), reqwest con rustls,
# zip + quick-xml solo para leer EPUB/CBZ.
[package]
name = "library"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.23"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
quick-xml = "0.41"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
